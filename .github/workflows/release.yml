name: Release

on:
  push:
    branches: [main]

# release-please needs to open PRs and create releases/tags; GoReleaser needs to
# upload assets to the release.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR from Conventional Commits. Merging that PR is what
      # sets release_created=true on a later run and produces the tag + release.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the push where the release PR was merged,
      # i.e. once the tag and GitHub Release already exist.
      - uses: actions/checkout@v5
        if: ${{ steps.release.outputs.release_created }}
        with:
          fetch-depth: 0 # full history + tags so GoReleaser can compute the version

      - uses: actions/setup-go@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
