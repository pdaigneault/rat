<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="rat — a speed-reading terminal reader">
  <title>rat</title>
  <desc>The word "rat" with its Optimal Recognition Point pivot letter highlighted, framed by RSVP guide marks and a progress bar.</desc>

  <defs>
    <!-- Subtle vertical dark background, matching the reader's dark theme. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <!-- Frame accent gradient (blue -> teal), used for the border and guides. -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f87af"/>
      <stop offset="1" stop-color="#2aa198"/>
    </linearGradient>
    <!-- Soft glow for the highlighted pivot letter. -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle card with a thin accent border. -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.9"/>

  <!-- Top guide caret (points down at the pivot column). -->
  <path d="M241 150 L271 150 L256 176 Z" fill="url(#accent)"/>

  <!-- The word: r a t, monospace bold, pivot 'a' centred and highlighted. -->
  <g font-family="'SFMono-Regular', 'JetBrains Mono', 'Menlo', 'Consolas', ui-monospace, monospace" font-size="188" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="152" y="272" fill="#e6e6e6">r</text>
    <text x="256" y="272" fill="#ff5f5f" filter="url(#glow)">a</text>
    <text x="360" y="272" fill="#e6e6e6">t</text>
  </g>

  <!-- Bottom guide caret (points up at the pivot column). -->
  <path d="M241 362 L271 362 L256 336 Z" fill="url(#accent)"/>

  <!-- Progress bar: filled portion in accent, remainder dim. -->
  <rect x="112" y="410" width="288" height="14" rx="7" fill="#3a3a3a"/>
  <rect x="112" y="410" width="132" height="14" rx="7" fill="url(#accent)"/>
</svg>
